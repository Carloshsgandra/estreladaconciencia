[build]
  command = "npm run build"
  publish = "dist-netlify"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/signin-with-chatgpt"
  to = "/acesso.html"
  status = 302

[[redirects]]
  from = "/signout-with-chatgpt"
  to = "/acesso.html?action=logout"
  status = 302

[functions]
  node_bundler = "esbuild"

# Run the static build together with Functions; do not autodetect legacy Vite files.
[dev]
  framework = "#static"
  publish = "dist-netlify"
  port = 8889
  autoLaunch = false
